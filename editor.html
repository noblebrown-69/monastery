<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  :root {
    --desk: #3C2F2F;
    --page: #F5E8C7;
    --text: #1a1a1a;
    --selection-bg: #D4AF37;
    --selection-fg: #000;
    --page-width: 8.5in;
    --page-min-height: 11in;
    --page-margin: 0 auto 40px;
    --page-shadow: 0 10px 40px rgba(0,0,0,0.7);
    --page-padding: 1in 0.85in;
    --page-border: 1px solid #8B7355;
    --editor-font: Georgia, "Noto Serif", serif;
  }
  html, body {
    height: 100%;
  }
  body {
    background: var(--desk);
    margin: 0;
    padding: 40px 0;
    font-family: var(--editor-font);
  }
  .page {
    width: var(--page-width);
    min-height: var(--page-min-height);
    margin: var(--page-margin);
    background: var(--page);
    box-shadow: var(--page-shadow);
    padding: var(--page-padding);
    box-sizing: border-box;
    border: var(--page-border);
  }
  #editor {
    min-height: 9in;
    outline: none;
    font-size: 12pt;
    line-height: 1.65;
    color: var(--text);
    font-family: var(--editor-font);
  }
  .page-break {
    page-break-after: always;
    border: none;
    border-top: 1px dashed #8B7355;
    margin: 30px 0;
  }
  ::selection {
    background: var(--selection-bg);
    color: var(--selection-fg);
  }
  @media print {
    html, body, .page, #editor {
      background: #ffffff !important;
      background-color: #ffffff !important;
      background-image: none !important;
      box-shadow: none !important;
      color: #000000 !important;
    }
    body {
      padding: 0 !important;
      margin: 0 !important;
    }
    .page {
      width: auto;
      min-height: auto;
      margin: 0;
      border: none;
      padding: 0;
    }
    .page-break {
      break-after: page;
      page-break-after: always;
      border: none;
      margin: 0;
    }
    * {
      -webkit-print-color-adjust: economy;
      print-color-adjust: economy;
    }
  }
</style>
</head>
<body>
  <div class="page">
    <div id="editor" contenteditable="true" spellcheck="true"></div>
  </div>

<script>
window.monasteryDirty = false;

function getWordCount() {
  const text = document.getElementById('editor').innerText || '';
  return text.trim().split(/\s+/).filter(Boolean).length;
}
function setContent(html) {
  document.getElementById('editor').innerHTML = html || '<p></p>';
}
function execCommand(cmd, val) {
  document.execCommand(cmd, false, val);
}
function markClean() {
  window.monasteryDirty = false;
}
function isDirty() {
  return !!window.monasteryDirty;
}

function applyTheme(t) {
  if (!t) return;
  const root = document.documentElement;
  const desk = t.desk || t.pageBg || '#3C2F2F';
  const pageBg = t.pageAsObject ? (t.pageBg || '#F5E8C7') : desk;
  root.style.setProperty('--desk', desk);
  root.style.setProperty('--page', pageBg);
  root.style.setProperty('--text', t.pageText || '#1a1a1a');
  root.style.setProperty('--selection-bg', t.selectionBg || '#D4AF37');
  root.style.setProperty('--selection-fg', t.selectionFg || '#000');
  const font = t.editorFont || 'Georgia, "Noto Serif", serif';
  root.style.setProperty('--editor-font', font);
  document.body.style.fontFamily = font;
  if (t.pageAsObject) {
    document.body.style.padding = '40px 0';
    root.style.setProperty('--page-width', '8.5in');
    root.style.setProperty('--page-min-height', '11in');
    root.style.setProperty('--page-margin', '0 auto 40px');
    root.style.setProperty('--page-shadow', '0 10px 40px rgba(0,0,0,0.7)');
    root.style.setProperty('--page-padding', '1in 0.85in');
    root.style.setProperty('--page-border', '1px solid #8B7355');
  } else {
    document.body.style.padding = '0';
    root.style.setProperty('--page-width', '100%');
    root.style.setProperty('--page-min-height', '100%');
    root.style.setProperty('--page-margin', '0');
    root.style.setProperty('--page-shadow', 'none');
    root.style.setProperty('--page-padding', '0.75in');
    root.style.setProperty('--page-border', 'none');
  }
}

function applyFontSize(pt) {
  document.execCommand('styleWithCSS', false, true);
  document.execCommand('fontSize', false, '7');
  const editor = document.getElementById('editor');
  editor.querySelectorAll('font[size="7"]').forEach(function(fontEl) {
    const span = document.createElement('span');
    span.style.fontSize = pt + 'pt';
    while (fontEl.firstChild)
      span.appendChild(fontEl.firstChild);
    fontEl.parentNode.replaceChild(span, fontEl);
  });
  window.monasteryDirty = true;
}

function sanitizePasted(root) {
  const allowed = {
    B:1, I:1, U:1, EM:1, STRONG:1, P:1, BR:1, DIV:1,
    H1:1, H2:1, H3:1, BLOCKQUOTE:1, UL:1, OL:1, LI:1
  };
  const drop = { SCRIPT:1, STYLE:1, META:1, LINK:1, IMG:1, SVG:1, IFRAME:1 };
  const nodes = Array.from(root.childNodes);
  for (const node of nodes) {
    if (node.nodeType === Node.COMMENT_NODE) {
      node.remove();
      continue;
    }
    if (node.nodeType !== Node.ELEMENT_NODE)
      continue;
    if (drop[node.tagName]) {
      node.remove();
      continue;
    }
    sanitizePasted(node);
    if (!allowed[node.tagName]) {
      const parent = node.parentNode;
      while (node.firstChild)
        parent.insertBefore(node.firstChild, node);
      parent.removeChild(node);
    } else {
      while (node.attributes.length)
        node.removeAttribute(node.attributes[0].name);
    }
  }
}

(function setupEditor() {
  const ed = document.getElementById('editor');
  const mark = function() { window.monasteryDirty = true; };
  ed.addEventListener('input', mark);
  ed.addEventListener('keyup', mark);
  ed.addEventListener('paste', function(e) {
    if (!e.clipboardData) return;
    const html = e.clipboardData.getData('text/html');
    const text = e.clipboardData.getData('text/plain');
    if (!html && !text) return;
    e.preventDefault();
    if (!html) {
      document.execCommand('insertText', false, text);
      window.monasteryDirty = true;
      return;
    }
    const tmp = document.createElement('div');
    tmp.innerHTML = html;
    sanitizePasted(tmp);
    document.execCommand('insertHTML', false, tmp.innerHTML || text);
    window.monasteryDirty = true;
  });
})();
</script>
</body>
</html>
